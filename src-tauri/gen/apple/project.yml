name: midi-stroke
options:
  bundleIdPrefix: com.vibetuned.midi-stroke
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Midi Stroke
      PRODUCT_BUNDLE_IDENTIFIER: com.vibetuned.midi-stroke
      DEVELOPMENT_TEAM: 47D2CT68R2
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  midi-stroke_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # The Rust library a build leaves here is linked (libapp.a under dependencies,
      # found through LIBRARY_SEARCH_PATHS), never copied into the app as a resource.
      - path: Externals
        buildPhase: none
      - path: midi-stroke_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: midi-stroke_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        # A phone plays held sideways (the phone layout is landscape only); an
        # iPad, which has the desktop layout, any way up.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # Asked before the Bluetooth MIDI view (plugins/native-midi) lists instruments.
        NSBluetoothAlwaysUsageDescription: Midi Stroke connects to your Bluetooth MIDI instrument to hear what you play.
        # HTTPS only: no export compliance question at each upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: 1.1.0
        CFBundleVersion: "1.1.0"
    entitlements:
      path: midi-stroke_iOS/midi-stroke_iOS.entitlements
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          # Xcode started from the Dock or Finder gets macOS's default PATH, without Homebrew's npm and node.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
# The target's scheme, declared here for its archive name (a target's own
# `scheme:` has none): Xcode's Organizer lists archives under it. The scheme
# keeps the target's name, which the Tauri CLI builds by.
schemes:
  midi-stroke_iOS:
    build:
      targets:
        midi-stroke_iOS: all
    run:
      config: debug
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    test:
      config: debug
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    profile:
      config: release
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    analyze:
      config: debug
    archive:
      config: release
      customArchiveName: Midi Stroke
