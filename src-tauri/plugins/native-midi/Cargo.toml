[package]
name = "tauri-plugin-native-midi"
version = "0.1.0"
authors = ["Pedro Fillastre"]
description = "Midi Stroke's MIDI on a phone or tablet: CoreMIDI on iOS, android.media.midi on Android"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-native-midi"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
