<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Rich diagonal dark slate-indigo background -->
        <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2C2C3E" />
            <stop offset="50%" stop-color="#1A1A25" />
            <stop offset="100%" stop-color="#0E0E14" />
        </linearGradient>

        <!-- Ambient radial glow behind the notes & active key -->
        <radialGradient id="ambientGlow" cx="52" cy="46" r="42" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7B74FF" stop-opacity="0.26" />
            <stop offset="55%" stop-color="#6B63FF" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#6B63FF" stop-opacity="0" />
        </radialGradient>

        <!-- Top-lit squircle rim highlight -->
        <linearGradient id="borderGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
            <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06" />
            <stop offset="100%" stop-color="#6B63FF" stop-opacity="0.14" />
        </linearGradient>

        <!-- Unified user-space gradient for the beamed eighth notes (eliminates shape seams) -->
        <linearGradient id="noteGrad" x1="32" y1="14" x2="68" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#B8B3FF" />
            <stop offset="45%" stop-color="#8E86FF" />
            <stop offset="100%" stop-color="#635BFF" />
        </linearGradient>

        <!-- Subtle top highlight for the note beam -->
        <linearGradient id="beamHighlight" x1="40" y1="15" x2="71" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
        </linearGradient>

        <!-- 3D white key top surface -->
        <linearGradient id="whiteKeyTop" x1="0" y1="0" x2="0" y2="25" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E6E6F0" />
        </linearGradient>

        <!-- Struck (active) key gradient -->
        <linearGradient id="activeKeyTop" x1="0" y1="0" x2="0" y2="25" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#DFDCFF" />
            <stop offset="45%" stop-color="#A39DFF" />
            <stop offset="100%" stop-color="#766EFF" />
        </linearGradient>

        <!-- 3D black key gradients -->
        <linearGradient id="blackKeyBody" x1="0" y1="0" x2="0" y2="16" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2C2C38" />
            <stop offset="100%" stop-color="#101016" />
        </linearGradient>

        <linearGradient id="blackKeyTop" x1="0" y1="0" x2="0" y2="13.5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3E3E4E" />
            <stop offset="100%" stop-color="#1E1E28" />
        </linearGradient>

        <!-- Soft multi-layer neon glow for the notes -->
        <filter id="noteGlow" x="-35%" y="-35%" width="170%" height="170%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur2" />
            <feMerge>
                <feMergeNode in="blur1" />
                <feMergeNode in="blur2" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Subtle glow for the struck key -->
        <filter id="keyGlow" x="-30%" y="-20%" width="160%" height="150%">
            <feGaussianBlur stdDeviation="2.2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- iOS: full bleed, no transparency; iOS draws its own rounded corners. -->
    <rect width="100" height="100" fill="url(#bgGrad)" />
    <circle cx="52" cy="46" r="42" fill="url(#ambientGlow)" />

    
    
    
    

    <!-- Beamed eighth notes: single unified path with exact tangent elliptical arcs -->
    <g filter="url(#noteGlow)">
        <path
            d="M39.8 20.8 C39.8 19.9 40.4 19.25 41.3 19.12 L69.5 15.1 C70.45 14.96 71.2 15.65 71.2 16.6 L71.2 36.98 A8 5.5 -22 1 1 67.8 32.91 L67.8 22.65 L43.2 26.15 L43.2 41.48 A8 5.5 -22 1 1 39.8 37.41 Z"
            fill="url(#noteGrad)"
        />

        <!-- Crisp top-edge specular highlight along the beam -->
        <path
            d="M40.8 19.55 L70.1 15.38 L70.1 16.5 L40.8 20.67 Z"
            fill="url(#beamHighlight)"
        />
    </g>

    <!-- Piano keyboard (centered: x=12..88, width=76) -->
    <g transform="translate(12, 60)">
        <!-- Recessed keyboard bed shadow -->
        <rect x="-1.5" y="-1.5" width="79" height="30" rx="3.5" fill="#09090E" fill-opacity="0.65" />

        <!-- Unpressed white keys (3D base + top surface) -->
        <g>
            <rect x="0" y="0" width="10" height="27" rx="2.2" fill="#B8B8CA" />
            <rect x="0" y="0" width="10" height="24.5" rx="2.2" fill="url(#whiteKeyTop)" />

            <rect x="11" y="0" width="10" height="27" rx="2.2" fill="#B8B8CA" />
            <rect x="11" y="0" width="10" height="24.5" rx="2.2" fill="url(#whiteKeyTop)" />

            <rect x="22" y="0" width="10" height="27" rx="2.2" fill="#B8B8CA" />
            <rect x="22" y="0" width="10" height="24.5" rx="2.2" fill="url(#whiteKeyTop)" />

            <rect x="33" y="0" width="10" height="27" rx="2.2" fill="#B8B8CA" />
            <rect x="33" y="0" width="10" height="24.5" rx="2.2" fill="url(#whiteKeyTop)" />

            <rect x="55" y="0" width="10" height="27" rx="2.2" fill="#B8B8CA" />
            <rect x="55" y="0" width="10" height="24.5" rx="2.2" fill="url(#whiteKeyTop)" />

            <rect x="66" y="0" width="10" height="27" rx="2.2" fill="#B8B8CA" />
            <rect x="66" y="0" width="10" height="24.5" rx="2.2" fill="url(#whiteKeyTop)" />
        </g>

        <!-- Struck 5th key (G) with pure indigo glow & depressed 3D bevel -->
        <rect x="44" y="1" width="10" height="26" rx="2.2" fill="#6B63FF" filter="url(#keyGlow)" />
        <g>
            <rect x="44" y="0.5" width="10" height="26.5" rx="2.2" fill="#4E46D9" />
            <rect x="44" y="0.5" width="10" height="25" rx="2.2" fill="url(#activeKeyTop)" />
            <rect x="45.5" y="21.5" width="7" height="2.4" rx="1.2" fill="#FFFFFF" fill-opacity="0.8" />
        </g>

        <!-- Black keys with drop shadow & 3D beveled keycap tops -->
        <g>
            <!-- C# -->
            <rect x="7.5" y="1" width="6" height="15.5" rx="1.6" fill="#000000" fill-opacity="0.35" />
            <rect x="7.5" y="0" width="6" height="15.5" rx="1.5" fill="url(#blackKeyBody)" />
            <rect x="8.2" y="0" width="4.6" height="13" rx="1" fill="url(#blackKeyTop)" />

            <!-- D# -->
            <rect x="18.5" y="1" width="6" height="15.5" rx="1.6" fill="#000000" fill-opacity="0.35" />
            <rect x="18.5" y="0" width="6" height="15.5" rx="1.5" fill="url(#blackKeyBody)" />
            <rect x="19.2" y="0" width="4.6" height="13" rx="1" fill="url(#blackKeyTop)" />

            <!-- F# -->
            <rect x="40.5" y="1" width="6" height="15.5" rx="1.6" fill="#000000" fill-opacity="0.35" />
            <rect x="40.5" y="0" width="6" height="15.5" rx="1.5" fill="url(#blackKeyBody)" />
            <rect x="41.2" y="0" width="4.6" height="13" rx="1" fill="url(#blackKeyTop)" />

            <!-- G# -->
            <rect x="51.5" y="1" width="6" height="15.5" rx="1.6" fill="#000000" fill-opacity="0.35" />
            <rect x="51.5" y="0" width="6" height="15.5" rx="1.5" fill="url(#blackKeyBody)" />
            <rect x="52.2" y="0" width="4.6" height="13" rx="1" fill="url(#blackKeyTop)" />

            <!-- A# -->
            <rect x="62.5" y="1" width="6" height="15.5" rx="1.6" fill="#000000" fill-opacity="0.35" />
            <rect x="62.5" y="0" width="6" height="15.5" rx="1.5" fill="url(#blackKeyBody)" />
            <rect x="63.2" y="0" width="4.6" height="13" rx="1" fill="url(#blackKeyTop)" />
        </g>
    </g>
</svg>
