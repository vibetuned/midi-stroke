# Publishes/updates the Homebrew cask in vibetuned/homebrew-tap whenever a
# release is PUBLISHED (drafts don't count — the asset URLs must be public).
# Users then install with:
#
#   brew install --cask vibetuned/tap/midi-stroke
#
# Needs the TAP_PUSH_TOKEN secret: a fine-grained PAT with contents:write
# on vibetuned/homebrew-tap (the same one battuta uses).
name: publish-cask

on:
  release:
    types: [published]

jobs:
  cask:
    runs-on: ubuntu-latest
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
    steps:
      - name: locate the dmg asset and hash it
        if: env.TAP_PUSH_TOKEN != ''
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          asset=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep '\.dmg$' | head -1)
          [ -n "$asset" ] || { echo "no dmg asset on $TAG — nothing to publish"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --output app.dmg
          version="${TAG#v}"
          interp='#{version}' # brew's own interpolation, inserted verbatim
          {
            echo "version=$version"
            echo "sha256=$(sha256sum app.dmg | cut -d' ' -f1)"
            # asset name with the literal version swapped for brew's #{version}
            echo "urlname=${asset//$version/$interp}"
          } >> "$GITHUB_OUTPUT"
      - name: checkout the tap
        if: env.TAP_PUSH_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: vibetuned/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
      - name: write and push the cask
        if: env.TAP_PUSH_TOKEN != ''
        env:
          VERSION: ${{ steps.dmg.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
          URLNAME: ${{ steps.dmg.outputs.urlname }}
        run: |
          set -euo pipefail
          mkdir -p Casks
          cat > Casks/midi-stroke.rb <<EOF
          cask "midi-stroke" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/vibetuned/midi-stroke/releases/download/v#{version}/$URLNAME"
            name "Midi Stroke"
            desc "MIDI training suite for piano, finger drums, saxophone and music theory"
            homepage "https://ms.vibetuned.com/"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "Midi Stroke.app"

            zap trash: [
              "~/Library/WebKit/dev.midistroke.app",
              "~/Library/Caches/dev.midistroke.app",
              "~/Library/Saved Application State/dev.midistroke.app.savedState",
            ]
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/midi-stroke.rb
          git diff --cached --quiet || git commit -m "midi-stroke $VERSION"
          git push
