name: Release desktop app

# Builds the Tauri desktop app and attaches the bundles to a DRAFT GitHub
# release — publish the draft when you're ready to ship. Publishing then
# triggers publish-cask.yml (Homebrew tap) and deploy.yml (apt repository).
#
# Trigger it either by pushing a version tag:
#   git tag v0.0.1 && git push origin v0.0.1
# or manually from the Actions tab (workflow_dispatch), which creates the
# tag from the version in src-tauri/tauri.conf.json.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary for Apple Silicon + Intel: a single dmg
          # asset, which is also what the Homebrew cask points at.
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          # Oldest LTS runner = broadest glibc compatibility for the deb.
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          # NSIS setup.exe; WebView2 is bootstrapped by the installer.
          - platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk for the webview, libasound for midir (ALSA MIDI),
      # libfuse2 for the AppImage tooling.
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            build-essential curl wget file libssl-dev libxdo-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization (ignored on Linux).
          # tauri-action imports the Developer ID certificate into a
          # throwaway keychain, signs the app, submits the dmg to Apple's
          # notary service, and staples the ticket. Unset secrets (e.g. on
          # a fork) leave the build unsigned rather than failing it.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Midi Stroke v__VERSION__'
          releaseBody: >
            Midi Stroke desktop app — signed and notarized macOS universal
            dmg, Windows installer, Debian package and AppImage. Prefer the
            package managers: `brew install --cask vibetuned/tap/midi-stroke`
            on macOS, `winget install Vibetuned.MidiStroke` on Windows, or
            the apt repository at https://ms.vibetuned.com/apt on
            Debian/Ubuntu (see https://ms.vibetuned.com/desktop/).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
