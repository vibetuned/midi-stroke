name: Release desktop app

# Builds the Tauri desktop app and attaches the bundles to a DRAFT GitHub
# release — publish the draft when you're ready to ship.
#
# Trigger it either by pushing a version tag:
#   git tag v0.0.1 && git push origin v0.0.1
# or manually from the Actions tab (workflow_dispatch), which creates the
# tag from the version in src-tauri/tauri.conf.json.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk for the webview, libasound for midir (ALSA MIDI),
      # libfuse2 for the AppImage tooling.
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            build-essential curl wget file libssl-dev libxdo-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Midi Stroke v__VERSION__'
          releaseBody: >
            Midi Stroke desktop app. macOS builds are unsigned — right-click →
            Open on first launch (or remove the quarantine flag with
            `xattr -dr com.apple.quarantine "Midi Stroke.app"`).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
