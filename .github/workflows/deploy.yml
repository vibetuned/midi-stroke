name: Deploy to GitHub Pages

# ms.vibetuned.com layout:
#   /      → the Starlight user guide (site/)
#   /app/  → the trainer itself (built with DEPLOY_BASE=/app/)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the app (served under /app/)
        run: |
          npm ci
          DEPLOY_BASE=/app/ npm run build

      - name: Build the docs site (served at the root)
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Compose site + app
        run: |
          mkdir -p out
          cp -R site/dist/. out/
          mkdir -p out/app
          cp -R dist/. out/app/
          cp public/CNAME out/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://ms.vibetuned.com
    steps:
      - uses: actions/deploy-pages@v4
