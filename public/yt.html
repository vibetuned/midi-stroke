<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Video</title>
<!-- YouTube embed wrapper for the Tauri desktop shell: the app's pages live
     on the tauri:// custom scheme, which YouTube rejects (player error 153 —
     no valid http(s) embedding origin). The shell frames THIS page from the
     deployed https origin instead, so the actual YouTube iframe below gets a
     valid referer. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  p { color: #888; font-family: system-ui, sans-serif; text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<script>
  var v = new URLSearchParams(location.search).get('v') || '';
  if (/^[A-Za-z0-9_-]{6,20}$/.test(v)) {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + v + '?autoplay=1&rel=0';
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    f.allowFullscreen = true;
    document.body.appendChild(f);
  } else {
    var p = document.createElement('p');
    p.textContent = 'Invalid video id';
    document.body.appendChild(p);
  }
</script>
</body>
</html>
